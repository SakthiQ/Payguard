# ── Test Profile Overrides ──
# Active in CI via SPRING_PROFILES_ACTIVE=test

# Disable Spring AI / Ollama auto-configuration so context loads without an Ollama server
spring.ai.ollama.chat.enabled=false
spring.ai.ollama.embedding.enabled=false
spring.autoconfigure.exclude=\
  org.springframework.ai.autoconfigure.ollama.OllamaAutoConfiguration,\
  org.springframework.ai.autoconfigure.ollama.OllamaChatAutoConfiguration,\
  org.springframework.ai.autoconfigure.ollama.OllamaEmbeddingAutoConfiguration

# Flyway — baseline-on-migrate so it works with an already-migrated CI DB
spring.flyway.baseline-on-migrate=true

# Reduce noise in test logs
logging.level.root=WARN
logging.level.com.java.PayGuard=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
